[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "facemath"
version = "0.4.0"
description = "Observation-driven, gauge-aware facial geometry evidence instrument"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "opencv-python>=4.9",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "myp>=1.5.8",
  "setuptools>=84.0.0",
  "ruff>=0.16.7",
  "sourcery>=1.45.0",
  "mypy>=2.3.1",
]

[project.optional-dependencies]
observer = ["mediapipe>=0.10"]
telemetry = ["torch>=2.2"]
dev = ["pytest>=8", "coverage>=7"]

[project.scripts]
facemath = "facemath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live_observer: requires locally installed MediaPipe and real model/image assets"]

[tool.coverage.run]
source = ["src/facemath"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
