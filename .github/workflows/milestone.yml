name: milestone-portability
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run --locked python scripts/validate_current.py --out runs/ci-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}-${{ matrix.python }}
          path: |
            runs/ci-validation/*.json
            runs/ci-validation/*.log
            runs/ci-validation/*.xml
            runs/ci-validation/*.zip
            runs/ci-validation/wheels/*.whl
            runs/ci-validation/wheel-check/*.json
            runs/ci-validation/wheel-check/*.xml
# Configuration for future hosted execution. This file is not evidence that
# Windows/macOS or all matrix combinations ran in the development container.
